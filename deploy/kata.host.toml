# Host config for the container deployment (deploy/). Copied from config/kata.example.toml: same
# sections and keys, values changed only where the containers need them. Keep in sync with it.
#
# Secrets: core reads no *_FILE variables (core/kata_core/config.py applies only the
# KATA_<SECTION>_<KEY> overrides). Compose maps each secret file under deploy/secrets/ (layout in
# deploy/secrets.example/README.md) into the env var named by the *_env key below. This file holds
# env var names only, never secret values.
#
# Service names used as hosts: postgres (database), core (worker).
# Override any key with KATA_<SECTION>_<KEY>.

[core]
host = "0.0.0.0"
port = 8080
# Public base URL for open links. Empty derives it from the request base URL.
public_url = ""

[database]
host = "postgres"
port = 5432
name = "kata_dev"
user = "kata_dev"
password_env = "KATA_DATABASE_PASSWORD"

[auth]
token_ttl_seconds = 3600
enrolment_ttl_seconds = 86400

[worker]
poll_interval_seconds = 5
request_timeout_seconds = 30
core_url = "http://core:8080"
# Compose service name of the core: the in-network host the worker may reach.
core_hosts = ["core"]
token_env = "KATA_WORKER_TOKEN"

[jobs]
lease_seconds = 300
# Seconds between polls of the job runner (python -m kata_core.jobs).
runner_poll_seconds = 5
# Cap on the output a job may store, in bytes.
max_output_bytes = 262144

[model]
base_url = "http://127.0.0.1:11434/v1"
model_name = "local-model"
timeout_seconds = 60
# Reasoning effort sent with each request; empty omits the field.
reasoning_effort = ""

[retrieval]
embedder = "fake"
model_name = ""
rrf_k = 60
candidate_limit = 50
dimensions = 64

[lesson_check]
min_score = 0.02
known_hits = 3
search_limit = 5

[cost]
cap_micro_usd = 2000000
warn_micro_usd = 1500000
# Pre-call guard: a cloud call is refused when spent + its estimated input cost * this percent / 100
# reaches the cap. Must be at least 100.
estimate_safety_percent = 150
# Upper bound of the input tokens one image costs in a cloud call (vision pre-call estimate).
image_input_tokens = 1600

# Opt-in smoke run, started by the lead by hand (never by CI). allowed_models lists the
# only models it may call; budget_micro_usd caps its spend. No secrets here: keys stay in env.
[smoke]
allowed_models = "claude-haiku-5-5"
budget_micro_usd = 500000

# Opt-in local smoke run, started by the lead by hand (never by CI). The base URL comes from env
# KATA_SMOKE_LOCAL_BASE_URL or the --base-url flag; it is never written here.
[smoke_local]
models = "kata-l"
case_timeout_seconds = 180
warmup_timeout_seconds = 600
num_ctx = 8192

# Local first for every task class: the cloud (anthropic) is always after local in the chain, so a
# class with no usable local provider falls to the cloud. The cloud turns on by itself when its
# token (api_key_env) is set; there is no separate switch. Secret guard, per-repository opt-in and
# the cost cap still apply to every cloud call.
# Per task class: comma list of provider names, tried in order.
[routing]
tag = "local,anthropic"
explain = "local,anthropic"
summary = "local,anthropic"
batch = "local,anthropic"
generate_course = "local,anthropic"
extract_syllabus = "local,anthropic"
scan_classify = "local,anthropic"
scan_extract = "local,anthropic"
quiz_generate = "local,anthropic"
# Model for page images: the routing chain of task class vision.
vision = "local,anthropic"

# Per task class: the local model that answers it, or "cloud-only" when no local model is good
# enough. kata-l and kata-m are the local models (see docs/research/benchmarks/RESULTS.md).
[local_capability]
tag = "kata-l"
explain = "kata-l"
summary = "kata-l"
batch = "kata-l"
generate_course = "kata-l"
extract_syllabus = "kata-l"
scan_classify = "kata-l"
scan_extract = "kata-l"
quiz_generate = "kata-l"
# No local vision model is verified yet: vision needs the cloud token until one is.
vision = "cloud-only"

[provider_local]
task_classes = "tag,explain,summary,batch,generate_course,extract_syllabus,scan_classify,scan_extract,quiz_generate,vision"

[provider_anthropic]
task_classes = "explain,summary,batch,generate_course,extract_syllabus,scan_classify,scan_extract,quiz_generate,vision"
base_url = "https://api.anthropic.com"
model_name = "claude-model"
api_key_env = "KATA_ANTHROPIC_API_KEY"
timeout_seconds = 60
cache_system = false

[policy]
quiet_mark_enabled = true
quiet_mark_idle_seconds = 600
nudge_enabled = true
nudge_error_threshold = 3
nudge_window_seconds = 900
stop_enabled = true
stop_error_threshold = 8
# Same limit for each type; state is kept per type.
rate_limit_seconds = 300
late_event_seconds = 120

[trainer]
# Trainer CLI run by the job runner. Config-supplied executable (TOML array); default is the dojo CLI in the container image.
enabled = true
command = ["/opt/trainer/dojo"]
# Optional wasm asset path passed to `dojo build --wasm`; empty leaves the flag out.
wasm = ""
# Optional web asset path passed to `dojo build --web`; empty leaves the flag out.
web = ""
# Seconds before a trainer run is killed.
timeout_seconds = 120
# Cap on concepts per generated course.
max_concepts = 10
# Cap on courses one user may hold; 0 means unlimited, negative values fail startup.
max_courses_per_user = 10
# Dojo ladder rung (0..3) a course starts at for its learning concepts; new concepts start at 0.
learning_start_rung = 2
# Minimum items a course must keep, else the job fails.
min_items = 5
# Cap on the trainer artifact size, in bytes.
max_artifact_bytes = 16777216
# Cap on a saved trainer progress document, in bytes (413 above it).
max_progress_bytes = 4194304
# Lifetime of a signed open link, in seconds.
open_link_ttl_seconds = 43200
# File holding the open-link signing key (at least 32 bytes). Required while trainer.enabled = true; startup exits 1 without it.
# Compose mounts the secret open_link_key at this path (deploy/secrets.example/README.md).
open_link_key_file = "/run/secrets/open_link_key"

[knowledge]
# Score change per trainer evidence step, and the largest change per save.
trainer_step = 0.1
trainer_max_step = 0.3
# Score at or above known_threshold is known; at or above learning_threshold is learning.
known_threshold = 0.8
learning_threshold = 0.4
# Contrary trainer evidence rows needed before a user mark is overwritten.
assertion_hold = 3
# Base score for a concept with no evidence, by mark state.
base_known = 0.9
base_learning = 0.5
base_new = 0.1

[syllabus]
enabled = true
# Ask the model for help when no syllabus structure is found.
model_extract = false
# Cap on the syllabus input size, in bytes.
max_bytes = 524288

[planning]
enabled = true
# Known share of a partly known unit at or above which it is skimmed, not studied.
skim_share = 0.5
# Words per unit of reading effort (units = ceil(words / words_per_unit), at least 1).
words_per_unit = 400
# Minutes per unit for each action.
minutes_skip = 1
minutes_skim = 5
minutes_practice = 15
minutes_learn = 30
# Days of known-mark history a goal's velocity is measured over (D15).
velocity_window_days = 14

# Model host: the GPU-PC model control and info service. Only the GPU-PC worker sets control_enabled = true.
[modelhost]
# Off by default: the worker never sends control requests unless this is true.
control_enabled = false
# Off by default: the scheduler never runs model swaps unless this is true.
schedule = false
# Base URL of the model host info service (loopback default; the GPU-PC serves it).
info_url = "http://127.0.0.1:11435"
# Path to the modelctl executable on the GPU-PC. Empty = not installed here.
modelctl_path = ""
# Directory of the model host checkout that holds modelctl. Empty = not installed here.
modelhost_dir = ""
# Seconds before a modelctl control run is killed.
control_timeout_seconds = 120
# Seconds before a capabilities request to the info service times out.
capabilities_timeout_seconds = 10
# Seconds a fetched capabilities document stays fresh before it is fetched again.
capabilities_ttl_seconds = 300
# Cap on the text the model host returns to the worker, in bytes.
max_text_bytes = 262144

[scan]
# Minimum classifier confidence (0..1) for a page to be classed without asking the owner.
classify_pass_bar = 0.8
# Cap on the candidate concepts offered for one block.
max_candidates = 5
# Blocks shorter than this many characters are skipped by the scan.
min_block_chars = 40
# Cap on the blocks one scan job may process.
max_blocks_per_job = 40

[exams]
# Cap on the bytes one exam result import body may have. Larger bodies get 413.
max_import_bytes = 262144

[quiz]
# Cap on the bytes one quiz source fetch reads.
max_fetch_bytes = 262144
# Cap on the questions kept from one quiz source.
max_questions_per_source = 50
# Questions in one mini quiz. At most 5.
mini_quiz_size = 5

[summary]
# Cap on the characters of the page text one summary job reads.
max_text_chars = 20000
# Cap on the characters of one summary.
max_summary_chars = 2000

[reader]
# The reader takes documents only when true. Off until the owner turns it on.
enabled = false
# Cap on the bytes one uploaded document may have.
max_file_bytes = 10485760
# Cap on the pages one document may have.
max_pages = 50
# A page with fewer text characters than this counts as scanned: its image goes to vision.
min_page_chars = 40
# Longest side of a page image sent to vision, in pixels.
max_image_side_px = 1600
# Cap on the bytes of one page image.
max_image_bytes = 2097152
# Cap on the page images one document may send to vision.
max_images_per_document = 20
# Cap on the text characters kept from one page.
max_text_chars_per_page = 20000
# Memory cap, in MB, of the sandboxed extract child process.
child_memory_mb = 1024
# CPU seconds cap of the sandboxed extract child process.
child_cpu_seconds = 30
# Wall-clock seconds cap of one extract.
wall_seconds = 60
# Seconds between two polls of the spool directory.
poll_seconds = 1
# Seconds the worker waits for one spool result.
wait_seconds = 120
# Directory the reader polls for jobs and writes results to.
spool_dir = "/spool"

[jokes]
enabled = true
sources = "jokeapi"
timeout_seconds = 10
max_response_bytes = 16384
max_joke_chars = 300
cache_size = 50
refill_interval_seconds = 7200
