# Compose stack for the VM: core, worker, migrate (one-shot), postgres and caddy (reverse proxy).
#   Images: kata:${KATA_IMAGE_TAG} is built elsewhere (dev, see deploy/compose.build.yaml) and shipped.
#   The VM runs no builds: compose only pulls the tag it is given.
#   Up:   set -a; . deploy/versions.env; set +a; docker compose --env-file deploy/env/small.env -f deploy/compose.yaml up -d
#   (KATA_IMAGE_TAG is required; the env file supplies the limits.)
#   Ports: only caddy publishes a port, on KATA_BIND_ADDR (default loopback). Core, worker and
#   postgres publish nothing. Override any ${VAR} with the environment; the env file sets the limits.
# Secrets: files under deploy/secrets/ (layout in deploy/secrets.example/README.md), mounted at
# /run/secrets/<name>. No password or token is written in this file.
# Config: deploy/kata.host.toml is mounted read-only as /config/kata.toml (KATA_CONFIG).

name: kata

x-core-env: &core-env
  KATA_CONFIG: /config/kata.toml

services:
  postgres:
    image: ${POSTGRES_IMAGE:?fill in deploy/versions.env}@${POSTGRES_DIGEST:?fill in deploy/versions.env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: kata_dev
      POSTGRES_DB: kata_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    mem_limit: ${KATA_MEM_POSTGRES:?set KATA_MEM_POSTGRES, e.g. with --env-file deploy/env/small.env}
    cpus: ${KATA_CPU_POSTGRES:?set KATA_CPU_POSTGRES, e.g. with --env-file deploy/env/small.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kata_dev -d kata_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: kata:${KATA_IMAGE_TAG:?set KATA_IMAGE_TAG, the image tag built on dev}
    restart: "no"
    environment: *core-env
    # Reads the password from the secret file into the env var core reads (core reads no *_FILE).
    command:
      - sh
      - -c
      - export KATA_DATABASE_PASSWORD="$$(cat /run/secrets/postgres_password)" && exec python -m kata_core.migrate
    secrets:
      - postgres_password
    volumes:
      - ./kata.host.toml:/config/kata.toml:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${KATA_MEM_CORE:?set KATA_MEM_CORE, e.g. with --env-file deploy/env/small.env}
    cpus: ${KATA_CPU_CORE:?set KATA_CPU_CORE, e.g. with --env-file deploy/env/small.env}

  core:
    image: kata:${KATA_IMAGE_TAG:?set KATA_IMAGE_TAG, the image tag built on dev}
    restart: unless-stopped
    # KATA_CORE_PUBLIC_URL: the public base URL for open links, from the host env (never in a tracked file).
    environment:
      <<: *core-env
      KATA_CORE_PUBLIC_URL: ${KATA_CORE_PUBLIC_URL:-}
    command:
      - sh
      - -c
      - export KATA_DATABASE_PASSWORD="$$(cat /run/secrets/postgres_password)" KATA_WORKER_TOKEN="$$(cat /run/secrets/worker_token)" && exec python -m kata_core
    # open_link_key is read by core from trainer.open_link_key_file (a file path, not an env var).
    secrets:
      - postgres_password
      - worker_token
      - open_link_key
    volumes:
      - ./kata.host.toml:/config/kata.toml:ro
    networks:
      - data
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${KATA_MEM_CORE:?set KATA_MEM_CORE, e.g. with --env-file deploy/env/small.env}
    cpus: ${KATA_CPU_CORE:?set KATA_CPU_CORE, e.g. with --env-file deploy/env/small.env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health/deep', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Worker: no ports. Reaches core on the data network; egress is for its model providers.
  worker:
    image: kata:${KATA_IMAGE_TAG:?set KATA_IMAGE_TAG, the image tag built on dev}
    restart: unless-stopped
    environment: *core-env
    command:
      - sh
      - -c
      - export KATA_WORKER_TOKEN="$$(cat /run/secrets/worker_token)" && exec python -m kata_worker
    secrets:
      - worker_token
    # The image HEALTHCHECK probes the core HTTP port; the worker serves none, so it would stay "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - ./kata.host.toml:/config/kata.toml:ro
      - reader-in:/spool/in:rw
      - reader-out:/spool/out:rw
    networks:
      - data
      - egress
    depends_on:
      core:
        condition: service_healthy
    mem_limit: ${KATA_MEM_WORKER:?set KATA_MEM_WORKER, e.g. with --env-file deploy/env/small.env}
    cpus: ${KATA_CPU_WORKER:?set KATA_CPU_WORKER, e.g. with --env-file deploy/env/small.env}

  # Reader: turns uploaded documents from the spool into text. No network, no secrets, read-only root.
  reader:
    image: kata:${KATA_IMAGE_TAG:?set KATA_IMAGE_TAG, the image tag built on dev}
    restart: unless-stopped
    environment: *core-env
    command:
      - python
      - -m
      - kata_reader
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    # Same as the worker: the image HEALTHCHECK probes the core HTTP port, which the reader does not serve.
    healthcheck:
      disable: true
    volumes:
      - ./kata.host.toml:/config/kata.toml:ro
      - reader-in:/spool/in:ro
      - reader-out:/spool/out:rw
    pids_limit: 128
    mem_limit: ${KATA_MEM_READER:-512m}
    cpus: ${KATA_CPU_READER:-1.0}

  caddy:
    image: ${CADDY_IMAGE:?fill in deploy/versions.env}@${CADDY_DIGEST:?fill in deploy/versions.env}
    restart: unless-stopped
    environment:
      KATA_TAILNET_NAME: ${KATA_TAILNET_NAME:?set KATA_TAILNET_NAME, the node name}
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${KATA_BIND_ADDR:-127.0.0.1}:443:443"
    volumes:
      # Caddyfile: deploy/Caddyfile. TLS files come from the certificate command run by deploy/systemd/kata-cert.service (D19, see Caddyfile).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - ${KATA_CERT_DIR:-/var/lib/kata/certs}:/var/run/tailscale/certs:ro
    networks:
      - edge
    mem_limit: ${KATA_MEM_PROXY:?set KATA_MEM_PROXY, e.g. with --env-file deploy/env/small.env}
    cpus: ${KATA_CPU_PROXY:?set KATA_CPU_PROXY, e.g. with --env-file deploy/env/small.env}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  worker_token:
    file: ./secrets/worker_token
  open_link_key:
    file: ./secrets/open_link_key

networks:
  data:
    internal: true
  edge: {}
  egress: {}

volumes:
  pgdata: {}
  caddy-data: {}
  reader-in: {}
  reader-out: {}
