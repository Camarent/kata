[project]
name = "kata"
version = "0.0.0"
requires-python = ">=3.11"
# stdlib only: tomllib ships with Python 3.11+, so no tomli dependency.
dependencies = ["fastapi==0.162.5", "psycopg[binary]==3.3.9", "httpx==0.28.1", "uvicorn==0.54.0"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
