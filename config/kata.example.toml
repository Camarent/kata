# Example kata configuration. Every key here is required in a real config file.
# Values are synthetic placeholders. Override any key with KATA_<SECTION>_<KEY>.

[core]
host = "127.0.0.1"
port = 8080

[database]
host = "127.0.0.1"
port = 5432
name = "kata_dev"
user = "kata_dev"
password_env = "KATA_DATABASE_PASSWORD"

[auth]
token_ttl_seconds = 3600
enrolment_ttl_seconds = 86400

[worker]
poll_interval_seconds = 5
request_timeout_seconds = 30
core_url = "http://127.0.0.1:8080"
token_env = "KATA_WORKER_TOKEN"

[jobs]
lease_seconds = 300

[model]
base_url = "http://127.0.0.1:11434/v1"
model_name = "local-model"
timeout_seconds = 60

[client]
request_timeout_seconds = 30

[retrieval]
embedder = "fake"
model_name = ""
rrf_k = 60
candidate_limit = 50
dimensions = 64

[lesson_check]
min_score = 0.02
known_hits = 3
search_limit = 5

[cost]
cap_micro_usd = 2000000
warn_micro_usd = 1500000

[routing]
# Per task class: comma list of provider names, tried in order.
tag = "local"
explain = "anthropic,local"
summary = "anthropic"
batch = "anthropic"

[providers]
cloud_enabled = false

[provider_local]
task_classes = "tag,explain"

[provider_anthropic]
allow_cloud = false
task_classes = "explain,summary,batch"
base_url = "https://api.anthropic.com"
model_name = "claude-model"
api_key_env = "KATA_ANTHROPIC_API_KEY"
timeout_seconds = 60
max_tokens = 1024
api_version = "2023-06-01"
