<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kata</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      main {
        padding: 12px;
        box-sizing: border-box;
        max-width: 100%;
      }
      input,
      button {
        min-height: 44px;
        box-sizing: border-box;
        font: inherit;
      }
      input {
        width: 100%;
      }
      button {
        min-width: 44px;
        padding: 0 16px;
      }
      .signin label {
        display: block;
        margin-bottom: 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      .label {
        overflow-wrap: anywhere;
      }
      .review-open,
      .back {
        min-height: 44px;
      }
      .review-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main id="panel"></main>
    <script type="module" src="dist/sidepanelBoot.js"></script>
  </body>
</html>
