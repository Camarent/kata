name: release-extension

# A version tag (v*) builds both extension zips and publishes them as a GitHub release.
# workflow_dispatch runs the tests only: every step that builds a release or touches the release is gated on a push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm --prefix extension ci --no-audit --no-fund
      - run: npm --prefix extension test
      - name: Read the version from the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: echo "KATA_EXTENSION_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build both browsers
        if: github.event_name == 'push'
        run: npm --prefix extension run build
      - name: Zip the builds
        if: github.event_name == 'push'
        run: |
          mkdir -p release
          python3 -I scripts/release/make_zip.py extension/dist/firefox "release/kata-extension-${KATA_EXTENSION_VERSION}-firefox.zip"
          python3 -I scripts/release/make_zip.py extension/dist/chrome "release/kata-extension-${KATA_EXTENSION_VERSION}-chrome.zip"
          (cd release && sha256sum kata-extension-*.zip > SHA256SUMS)
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$TAG"
          fi
